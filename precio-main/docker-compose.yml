# Alternativa ao uso dos .bat:  docker compose up -d --build
# (não use os dois ao mesmo tempo: os nomes de container e as portas são os mesmos)
name: precio

services:
  db:
    build: { context: ., dockerfile: docker/mysql/Dockerfile }
    image: precio-db:1.0
    container_name: precio-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: precio_db
      MYSQL_USER: precio
      MYSQL_PASSWORD: precio123
      TZ: America/Sao_Paulo
    ports:
      - "${PRECIO_DB_PORT:-3307}:3306"      # para o MySQL Workbench
    volumes:
      - precio_db_data:/var/lib/mysql
    networks: [precio-net]

  web:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    image: precio-web:1.0
    container_name: precio-web
    restart: unless-stopped
    environment:
      DB_HOST: precio-db
      DB_PORT: "3306"
      DB_NAME: precio_db
      DB_USER: precio
      DB_PASS: precio123
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - precio_cache:/var/www/html/back-end/cache
      - precio_logs:/var/www/html/back-end/logs
    networks: [precio-net]

  scraper:
    build: { context: ., dockerfile: docker/scraper/Dockerfile }
    image: precio-scraper:1.0
    container_name: precio-scraper
    restart: unless-stopped
    networks: [precio-net]

  nginx:
    build: { context: ., dockerfile: docker/nginx/Dockerfile }
    image: precio-nginx:1.0
    container_name: precio-nginx
    restart: unless-stopped
    ports:
      - "${PRECIO_PORT:-8080}:80"           # http://localhost:8080
    depends_on:
      web: { condition: service_healthy }
    networks: [precio-net]

networks:
  precio-net:
    name: precio-net

volumes:
  precio_db_data:
  precio_cache:
  precio_logs:
