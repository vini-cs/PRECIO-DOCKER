server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # DNS interno do Docker: resolve "precio-web" em tempo de requisição,
    # então o nginx sobe mesmo que o Apache ainda esteja iniciando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://precio-web:80;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # buscas com scraping podem demorar
    }
}
